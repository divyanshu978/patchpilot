services:
  postgres:
    image: postgres:17-alpine
    container_name: patchpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patchpilot}
      POSTGRES_USER: ${POSTGRES_USER:-patchpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patchpilot} -d ${POSTGRES_DB:-patchpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: